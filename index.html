<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>圳智成城 · 学术矩阵</title>
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#252836;--border:#2e3148;--text:#e2e8f0;--muted:#6b7280;
  --core:#22c55e;--core-bg:rgba(34,197,94,.15);--core-bd:rgba(34,197,94,.4);
  --aux:#f59e0b;--aux-bg:rgba(245,158,11,.15);--aux-bd:rgba(245,158,11,.4);
  --manual:#818cf8;--red:#ef4444;--col-w:28px;--label-w:220px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
/* ── TABS ── */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0;}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;transition:.15s;}
.tab:hover{color:var(--text);}
.tab.active{color:#22c55e;border-bottom-color:#22c55e;}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.topbar h1{font-size:15px;font-weight:700;background:linear-gradient(135deg,#22c55e,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--muted);}
.stat b{color:var(--text);}
.spacer{flex:1;}
.btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 11px;cursor:pointer;font-size:12px;}
.btn:hover{background:var(--border);}
.btn.g{border-color:#22c55e55;color:#22c55e;}
.ts{font-size:11px;color:var(--muted);}
/* ── LEGEND ── */
.legend{display:flex;gap:14px;padding:5px 16px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0;}
.dot{width:13px;height:13px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:4px;}
/* ── PAGES ── */
.page{flex:1;overflow:hidden;display:none;}
.page.active{display:flex;}
/* ═══ MATRIX VIEW ═══ */
#page-matrix{flex-direction:row;overflow:hidden;}
.left-col{flex-shrink:0;width:var(--label-w);overflow:hidden;}
.left-col .spc{height:72px;background:var(--bg2);border-right:1px solid var(--border);border-bottom:2px solid var(--border);}
.cat-h{height:22px;line-height:22px;padding:0 10px;background:var(--bg2);border-right:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border);}
.tlabel{height:26px;line-height:26px;padding:0 10px;background:var(--bg);border-right:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;cursor:pointer;}
.tlabel:hover{background:var(--bg3);color:#fff;}
.right-panel{overflow:auto;flex:1;}
.chdr{position:sticky;top:0;z-index:10;background:var(--bg2);border-bottom:2px solid var(--border);}
.part-row{display:flex;height:28px;}
.pcell{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-right:2px solid var(--border);}
.ch-row{display:flex;height:44px;}
.chcell{width:var(--col-w);min-width:var(--col-w);height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted);border-right:1px solid var(--border);cursor:pointer;padding:2px 0;}
.chcell:hover{background:var(--bg3);color:var(--text);}
.chcell.pl{border-right:2px solid var(--border);}
.ch-label{writing-mode:vertical-rl;font-size:10px;}
.ch-avatar{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;}
/* author legend */
.author-legend{display:flex;gap:10px;padding:5px 16px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;flex-shrink:0;flex-wrap:wrap;}
.al-item{display:flex;align-items:center;gap:5px;}
.al-dot{width:10px;height:10px;border-radius:50%;}
.cell{width:var(--col-w);min-width:var(--col-w);height:26px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;transition:filter .1s;}
.cell:hover{filter:brightness(1.4);z-index:5;}
.cell.pl{border-right:2px solid var(--border);}
.cell[data-s="core"],.cell[data-s="manual_core"]{background:var(--core-bg);}
.cell[data-s="aux"],.cell[data-s="manual_aux"]{background:var(--aux-bg);}
.cell[data-s="none"],.cell[data-s="manual_none"]{background:var(--bg);}
.cell.bpc{outline:1.5px dashed rgba(34,197,94,.3);outline-offset:-2px;}
.cell.bpa{outline:1.5px dashed rgba(245,158,11,.3);outline-offset:-2px;}
.ci{font-size:11px;pointer-events:none;user-select:none;}
.cell[data-s="core"] .ci,.cell[data-s="manual_core"] .ci{color:var(--core);}
.cell[data-s="aux"] .ci,.cell[data-s="manual_aux"] .ci{color:var(--aux);}
.cell[data-s="manual_core"] .ci,.cell[data-s="manual_aux"] .ci{color:var(--manual);}
.cell[data-s="none"] .ci,.cell[data-s="manual_none"] .ci{color:transparent;}
.cell.mo::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--manual);}
/* ═══ REMINDER VIEW ═══ */
#page-remind{flex-direction:column;overflow-y:auto;padding:16px;}
.rchapter{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.rch-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;}
.rch-head:hover{background:var(--bg3);}
.rch-num{font-size:18px;font-weight:800;color:var(--muted);min-width:32px;}
.rch-title{font-size:13px;font-weight:600;flex:1;}
.rch-score{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);}
.rch-score.done{color:#22c55e;border-color:#22c55e55;}
.rch-score.warn{color:#f59e0b;border-color:#f59e0b55;}
.rch-score.danger{color:#ef4444;border-color:#ef444455;}
.rch-bar{height:3px;background:var(--border);}
.rch-fill{height:100%;transition:width .3s;}
.rch-body{display:none;padding:12px 14px;border-top:1px solid var(--border);}
.rch-body.open{display:block;}
.gap-section{margin-bottom:10px;}
.gap-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.gap-label.core{color:var(--red);}
.gap-label.aux{color:var(--aux);}
.gap-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:7px;margin-bottom:5px;background:var(--bg3);border:1px solid var(--border);}
.gap-item:hover{border-color:var(--border);filter:brightness(1.1);}
.gap-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.gap-dot.core{background:var(--red);}
.gap-dot.aux{background:var(--aux);}
.gap-info{flex:1;}
.gap-name{font-size:12px;font-weight:600;color:var(--text);}
.gap-hint{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5;}
.gap-q{font-size:11px;color:#60a5fa;margin-top:3px;font-style:italic;}
.gap-links{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.lnk{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--muted);text-decoration:none;cursor:pointer;}
.lnk:hover{color:var(--text);border-color:#4b5563;}
.done-list{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0;}
.done-chip{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--core-bg);border:1px solid var(--core-bd);color:var(--core);}
/* ═══ THEORY ENCYCLOPEDIA ═══ */
#page-enc{flex-direction:row;overflow:hidden;}
.enc-list{width:240px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);}
.enc-cat{padding:6px 12px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--bg2);border-bottom:1px solid var(--border);}
.enc-item{padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:12px;}
.enc-item:hover{background:var(--bg3);}
.enc-item.active{background:var(--bg3);color:#22c55e;border-left:3px solid #22c55e;}
.enc-detail{flex:1;overflow-y:auto;padding:24px 28px;}
.enc-detail h2{font-size:18px;font-weight:800;margin-bottom:6px;}
.enc-detail .cat-tag{font-size:11px;color:var(--muted);margin-bottom:18px;}
.enc-section{margin-bottom:18px;}
.enc-section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;}
.enc-section p{font-size:13px;line-height:1.7;color:var(--text);}
.enc-q{background:rgba(96,165,250,.1);border-left:3px solid #60a5fa;padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;color:#93c5fd;font-style:italic;line-height:1.6;}
.enc-cite{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--muted);font-family:monospace;line-height:1.6;word-break:break-all;}
.enc-links{display:flex;flex-direction:column;gap:6px;}
.enc-link{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--muted);font-size:12px;cursor:pointer;}
.enc-link:hover{color:var(--text);border-color:#4b5563;}
.enc-link .arr{margin-left:auto;font-size:10px;}
.enc-usage{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.uchip{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--border);cursor:pointer;}
.uchip.core{background:var(--core-bg);border-color:var(--core-bd);color:var(--core);}
.uchip.aux{background:var(--aux-bg);border-color:var(--aux-bd);color:var(--aux);}
.uchip.none{background:var(--bg3);color:var(--muted);}
/* ── TOOLTIP ── */
.tt{display:none;position:fixed;z-index:300;background:#1e2130;border:1px solid var(--border);border-radius:8px;padding:10px 12px;max-width:260px;font-size:11px;line-height:1.5;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.tt b{color:var(--text);}
.tt .s{color:var(--muted);font-size:10px;}
/* ── CHAPTER PANEL ── */
.ch-panel{position:fixed;top:0;right:0;width:340px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 32px rgba(0,0,0,.4);}
.ch-panel.open{transform:translateX(0);}
.cp-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;}
.cp-num{font-size:28px;font-weight:800;line-height:1;min-width:36px;}
.cp-titles{flex:1;}
.cp-title{font-size:14px;font-weight:700;line-height:1.4;}
.cp-part{font-size:11px;color:var(--muted);margin-top:3px;}
.cp-close{cursor:pointer;color:var(--muted);font-size:18px;padding:2px 6px;border-radius:4px;flex-shrink:0;}
.cp-close:hover{color:var(--text);background:var(--bg3);}
.cp-progress{padding:10px 18px 12px;border-bottom:1px solid var(--border);}
.cp-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.cp-bar-fill{height:100%;border-radius:3px;}
.cp-pct{font-size:11px;color:var(--muted);}
.cp-body{flex:1;overflow-y:auto;padding:12px 16px;}
.cp-section{margin-bottom:14px;}
.cp-slabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.cp-slabel.core{color:var(--red);}
.cp-slabel.aux{color:var(--aux);}
.cp-slabel.done{color:#22c55e;}
.cp-item{padding:6px 9px;border-radius:6px;margin-bottom:4px;background:var(--bg3);border:1px solid var(--border);font-size:11px;}
.cp-item .cn{font-weight:600;color:var(--text);}
.cp-item .cq{color:#60a5fa;font-style:italic;margin-top:2px;font-size:10px;}
.cp-item .ch{color:var(--muted);margin-top:2px;font-size:10px;line-height:1.4;}
.cp-item .clinks{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.cp-done-chips{display:flex;flex-wrap:wrap;gap:4px;}
.cp-chip{font-size:10px;padding:2px 8px;border-radius:10px;}
.cp-chip.core{background:var(--core-bg);border:1px solid var(--core-bd);color:var(--core);}
.cp-chip.aux{background:var(--aux-bg);border:1px solid var(--aux-bd);color:var(--aux);}
.cp-overlay{display:none;position:fixed;inset:0;z-index:199;background:rgba(0,0,0,.25);}
.cp-overlay.show{display:block;}
/* highlight active column */
.col-highlight{background:rgba(96,165,250,.07)!important;}
/* ── HOME ── */
body{display:flex;flex-direction:column;}
#page-home{background:var(--bg);}
.book-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;}
.book-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4);}
.book-card-top{height:120px;display:flex;align-items:flex-end;padding:16px;position:relative;}
.book-card-title{font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);letter-spacing:.04em;}
.book-card-body{padding:14px 16px;}
.book-card-sub{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.book-card-authors{font-size:12px;color:var(--text);margin-bottom:10px;}
.book-card-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.bstat{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);}
.bstat b{color:var(--text);}
.book-progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.book-progress-fill{height:100%;border-radius:2px;transition:width .4s;}
.status-badge{position:absolute;top:12px;right:12px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.06em;}
.status-writing{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid #22c55e55;}
.status-planning{background:rgba(156,163,175,.15);color:#9ca3af;border:1px solid #4b556355;}
.status-done{background:rgba(96,165,250,.2);color:#60a5fa;border:1px solid #60a5fa55;}
.add-card{background:var(--bg2);border:2px dashed var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:default;min-height:220px;color:var(--muted);font-size:13px;}
.add-card:hover{border-color:#4b5563;color:var(--text);}
</style>
</head>
<body>

<!-- ═══ HOME SCREEN ═══ -->
<div id="page-home" style="flex:1;overflow-y:auto;padding:40px 32px;display:flex;flex-direction:column;">
  <div style="max-width:900px;margin:0 auto;width:100%;">
    <div style="margin-bottom:36px;">
      <div style="font-size:28px;font-weight:800;letter-spacing:.04em;background:linear-gradient(135deg,#22c55e,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;">书系工作台</div>
      <div style="color:#6b7280;font-size:13px;">点击一本书，进入学术矩阵与提醒导航</div>
    </div>
    <div id="book-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;"></div>
  </div>
</div>

<div id="main-ui" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
<div class="topbar">
  <button class="btn" onclick="goHome()" style="font-size:12px;padding:4px 10px">← 书系</button>
  <h1 id="book-title-bar">圳智成城 · 学术矩阵</h1>
  <div class="stat" id="st1"></div>
  <div class="stat" id="st2"></div>
  <div class="stat" id="st3"></div>
  <div class="spacer"></div>
  <button class="btn" onclick="toggleBp()" title="显示/隐藏大纲建议">📋 蓝图</button>
  <button class="btn g" onclick="exportOv()">💾 导出标记</button>
  <span class="ts" id="tsgen"></span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('matrix')">📊 矩阵视图</div>
  <div class="tab" onclick="switchTab('remind')">🔔 提醒导航</div>
  <div class="tab" onclick="switchTab('enc')">📚 理论百科</div>
  <div class="tab" onclick="switchTab('progress')">📋 写作进度</div>
</div>

<div class="legend">
  <span><span class="dot" style="background:var(--core-bg);border:1.5px solid var(--core-bd)"></span>理论锚点检测到</span>
  <span><span class="dot" style="background:var(--aux-bg);border:1.5px solid var(--aux-bd)"></span>章节文本检测到</span>
  <span><span class="dot" style="border:1.5px dashed #4b5563;background:transparent"></span>大纲建议未写</span>
  <span style="color:#818cf8">● 手动标记</span>
  <span style="color:#6b7280;font-size:10px">点击切换状态 · 双击重置</span>
</div>
<div class="author-legend" id="author-legend"></div>

<!-- ═══ MATRIX VIEW ═══ -->
<div class="page active" id="page-matrix">
  <div class="left-col" id="lcol"></div>
  <div class="right-panel" id="rpanel"></div>
</div>

<!-- ═══ REMINDER VIEW ═══ -->
<div class="page" id="page-remind">
  <div id="remind-content"></div>
</div>

<!-- ═══ ENCYCLOPEDIA VIEW ═══ -->
<div class="page" id="page-enc">
  <div class="enc-list" id="enc-list"></div>
  <div class="enc-detail" id="enc-detail"><p style="color:var(--muted);margin-top:40px;text-align:center">← 点击左侧选择理论</p></div>
</div>

<div class="page" id="page-progress" style="flex-direction:column;overflow-y:auto;padding:20px">
  <div id="progress-content"></div>
</div>

</div><!-- /main-ui -->

<!-- Chapter detail panel -->
<div class="cp-overlay" id="cp-overlay" onclick="closeChPanel()"></div>
<div class="ch-panel" id="ch-panel">
  <div class="cp-head">
    <div class="cp-num" id="cp-num"></div>
    <div class="cp-titles">
      <div class="cp-title" id="cp-title"></div>
      <div class="cp-part" id="cp-part"></div>
    </div>
    <div class="cp-close" onclick="closeChPanel()">✕</div>
  </div>
  <div class="cp-progress">
    <div class="cp-bar"><div class="cp-bar-fill" id="cp-bar-fill"></div></div>
    <div class="cp-pct" id="cp-pct"></div>
  </div>
  <div class="cp-body" id="cp-body"></div>
</div>

<script>

6–1151. https://doi.org/10.1257/jel.49.4.1076", "links": [["Google Scholar · decentralized authoritarianism Shenzhen", "https://scholar.google.com/scholar?q=decentralized%20authoritarianism%20China%20local%20government%20Shenzhen"], ["Semantic Scholar · Xu China institutions", "https://www.semanticscholar.org/search?q=Xu%20fundamental%20institutions%20China%20decentralization&sort=Relevance"], ["CNKI · 深圳 分权 地方政府 激励", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%9C%B0%E6%96%B9%E6%94%BF%E5%BA%9C%20%E5%88%86%E6%9D%83%20%E5%AE%98%E5%91%98%E6%BF%80%E5%8A%B1"]]}, {"id": "Evans", "name": "Evans · 嵌入式自主性", "category": "制度与政治经济学", "核心命题": "发展型国家的能力是'嵌入式自主性'——既与社会/产业嵌入（获取真实信息），又保持自主性（抵御利益集团捕获）。", "深圳意义": "深圳政府能持续正式化涌现成果的原因不只是权威，而是长期与市场行动者保持嵌入关系——驻场官员、产业对话机制、常态化企业调研。", "写作追问": "这节里政府是怎么'知道'企业/社区需要什么的？信息渠道是什么？有没有被特定利益集团捕获的迹象？", "citation": "Evans, P. (1995). Embedded autonomy: States and industrial transformation. Princeton University Press.", "links": [["Google Scholar · embedded autonomy Shenzhen state", "https://scholar.google.com/scholar?q=embedded%20autonomy%20developmental%20state%20Shenzhen%20China"], ["Semantic Scholar · Evans state industrial", "https://www.semanticscholar.org/search?q=Evans%20embedded%20autonomy%20state%20industrial%20transformation&sort=Relevance"], ["CNKI · 发展型国家 深圳 政府能力", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E5%8F%91%E5%B1%95%E5%9E%8B%E5%9B%BD%E5%AE%B6%20%E6%B7%B1%E5%9C%B3%20%E6%94%BF%E5%BA%9C%E8%83%BD%E5%8A%9B%20%E5%B5%8C%E5%85%A5"]]}, {"id": "LinYifu", "name": "林毅夫 · 新结构经济学", "category": "制度与政治经济学", "核心命题": "新结构经济学：一国应该发展与其要素禀赋比较优势匹配的产业；政府应该因势利导，而非违背比较优势强推重工业。", "深圳意义": "深圳的产业升级——从劳动密集型到科技密集型——是比较优势动态演化的教科书案例。林毅夫框架提供'升级路径正当性'的理论支撑。", "写作追问": "这节的产业变化，是顺应了深圳当时的要素禀赋，还是超前部署？如果超前，代价是什么？", "citation": "Lin, J. Y. (2012). New structural economics: A framework for rethinking development and policy. World Bank Publications.", "links": [["Google Scholar · new structural economics Shenzhen", "https://scholar.google.com/scholar?q=new%20structural%20economics%20comparative%20advantage%20Shenzhen%20China"], ["Semantic Scholar · Lin structural economics", "https://www.semanticscholar.org/search?q=Lin%20Yifu%20new%20structural%20economics%20development&sort=Relevance"], ["CNKI · 新结构经济学 深圳 产业升级", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%96%B0%E7%BB%93%E6%9E%84%E7%BB%8F%E6%B5%8E%E5%AD%A6%20%E6%B7%B1%E5%9C%B3%20%E4%BA%A7%E4%B8%9A%E5%8D%87%E7%BA%A7%20%E6%AF%94%E8%BE%83%E4%BC%98%E5%8A%BF"]]}, {"id": "LanXiaobo", "name": "兰小欢 · 土地财政", "category": "制度与政治经济学", "核心命题": "土地财政是中国城市化的核心财政机制：政府垄断土地一级市场，卖地收入支撑基础设施投资，形成'土地-基建-增长'循环。", "深圳意义": "深圳1987年土地拍卖是全国土地财政的制度起点。没有深圳率先突破，这套机制不会在全国铺开。但这个循环的代价是城中村、高房价、宅基地产权困境。", "写作追问": "这节涉及的土地决策，背后的财政逻辑是什么？谁得到了增值收益，谁承担了成本？", "citation": "兰小欢. (2019). 置身事内：中国政府与经济发展. 上海人民出版社.", "links": [["Google Scholar · land finance Shenzhen China", "https://scholar.google.com/scholar?q=land%20finance%20fiscal%20system%20Shenzhen%20China%20urbanization"], ["Semantic Scholar · China land finance", "https://www.semanticscholar.org/search?q=China%20land%20finance%20local%20government%20fiscal%20urbanization&sort=Relevance"], ["CNKI · 深圳 土地财政 制度", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%9C%9F%E5%9C%B0%E8%B4%A2%E6%94%BF%20%E5%9C%9F%E5%9C%B0%E6%8B%8D%E5%8D%96%20%E5%88%B6%E5%BA%A6%E5%8F%98%E8%BF%81"]]}, {"id": "YaoYang", "name": "姚洋 · 晋升锦标赛", "category": "制度与政治经济学", "核心命题": "晋升锦标赛：中国地方官员在以GDP为核心指标的晋升竞争中，有强烈激励发展本辖区经济；这既是增长引擎，也是扭曲来源。", "深圳意义": "深圳历任市委书记的制度创新冲动，不全是理想主义，也有晋升逻辑。理解这一点，才能理解为什么某些改革在换届后会停滞甚至倒退。", "写作追问": "这节的政策决定，官员个人的政治激励是什么？如果没有晋升压力，这个决策还会发生吗？", "citation": "Yao, Y. (2009). The political economy of government policies toward regional inequality in China. In Y. Huang & A. M. Bocchi (Eds.), Reshaping economic geography in East Asia. World Bank Publications.", "links": [["Google Scholar · tournament competition China local officials", "https://scholar.google.com/scholar?q=promotion%20tournament%20competition%20local%20officials%20China%20GDP"], ["Semantic Scholar · China political economy regional", "https://www.semanticscholar.org/search?q=China%20political%20economy%20regional%20competition%20officials%20incentives&sort=Relevance"], ["CNKI · 晋升锦标赛 地方官员 深圳", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%99%8B%E5%8D%87%E9%94%A6%E6%A0%87%E8%B5%9B%20%E5%9C%B0%E6%96%B9%E5%AE%98%E5%91%98%20%E6%B7%B1%E5%9C%B3%20GDP%E7%AB%9E%E4%BA%89"]]}, {"id": "ZhouQiren", "name": "周其仁 · 产权改革", "category": "制度与政治经济学", "核心命题": "产权改革是中国经济转型的核心，关键是'确权'——让经济行动者对其控制的资产有明确、稳定、可流转的产权预期。", "深圳意义": "1987年深圳土地拍卖的制度意义，不只是卖了一块地，而是第一次让'土地使用权可以交易'这个产权概念在中国法律上站立。城中村的困境也是产权不清晰的直接后果。", "写作追问": "这节里的行动者，有没有明确的产权预期？产权不清对他们的行为产生了什么影响？", "citation": "周其仁. (2010). 城乡中国（上下册）. 中信出版社.", "links": [["Google Scholar · property rights reform Shenzhen", "https://scholar.google.com/scholar?q=property%20rights%20reform%20Shenzhen%20land%20China"], ["Semantic Scholar · China property rights", "https://www.semanticscholar.org/search?q=China%20property%20rights%20reform%20urban%20land&sort=Relevance"], ["CNKI · 深圳 产权改革 土地", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E4%BA%A7%E6%9D%83%E6%94%B9%E9%9D%A9%20%E5%9C%9F%E5%9C%B0%E7%A1%AE%E6%9D%83%20%E5%9F%8E%E4%B8%AD%E6%9D%91"]]}, {"id": "QianWeingast", "name": "Qian-Weingast · 市场保护型联邦", "category": "制度与政治经济学", "核心命题": "市场保护型联邦制（MPF）：地方政府有财政激励来发展市场、保护产权；分权创造竞争，竞争创造制度创新。", "深圳意义": "解释深圳地方政府为什么有强烈动机持续改革——它从这片土地的增值中直接获益，因此有强烈激励去维护而非掠夺市场。", "写作追问": "这节里地方政府的财政收益和制度决策之间，有什么因果关系？它是在保护市场，还是在攫取市场？", "citation": "Qian, Y., & Weingast, B. R. (1997). Federalism as a commitment to preserving market incentives. Journal of Economic Perspectives, 11(4), 83–92. https://doi.org/10.1257/jep.11.4.83", "links": [["Google Scholar · market-preserving federalism Shenzhen", "https://scholar.google.com/scholar?q=market%20preserving%20federalism%20China%20Shenzhen%20fiscal"], ["Semantic Scholar · Qian Weingast federalism", "https://www.semanticscholar.org/search?q=Qian%20Weingast%20federalism%20market%20preserving%20China&sort=Relevance"], ["CNKI · 深圳 财政分权 市场化", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E8%B4%A2%E6%94%BF%E5%88%86%E6%9D%83%20%E5%B8%82%E5%9C%BA%E5%8C%96%20%E5%9C%B0%E6%96%B9%E6%94%BF%E5%BA%9C"]]}, {"id": "Glaeser", "name": "Glaeser · 知识溢出与密度", "category": "城市经济学", "核心命题": "城市的核心价值是知识溢出：面对面接触加速思想传播，高密度聚集产生知识外部性，这是城市比郊区生产率更高的根本原因。", "深圳意义": "深圳科创的空间机制。鹏城实验室、南山科技园、光明科学城——高密度聚集不是政策口号，是产生知识溢出的物理条件。", "写作追问": "这节描述的创新或知识传播，是通过什么样的面对面接触发生的？高密度带来了什么，也带走了什么？", "citation": "Glaeser, E. L. (2011). Triumph of the city: How our greatest invention makes us richer, smarter, greener, healthier, and happier. Penguin Press.", "links": [["Google Scholar · knowledge spillovers Shenzhen innovation", "https://scholar.google.com/scholar?q=knowledge%20spillovers%20density%20Shenzhen%20innovation%20cluster"], ["Semantic Scholar · Glaeser cities knowledge", "https://www.semanticscholar.org/search?q=Glaeser%20cities%20knowledge%20spillovers%20urban%20productivity&sort=Relevance"], ["CNKI · 深圳 知识溢出 城市密度", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E7%9F%A5%E8%AF%86%E6%BA%A2%E5%87%BA%20%E5%88%9B%E6%96%B0%20%E5%9F%8E%E5%B8%82%E5%AF%86%E5%BA%A6"]]}, {"id": "Brueckner", "name": "Brueckner · 城市结构/bid-rent", "category": "城市经济学", "核心命题": "Bid-rent曲线：不同使用者（企业/居民）对土地的出价随距城市中心距离递减；竞租均衡决定城市空间结构和土地利用方式。", "深圳意义": "解释深圳城中村的位置逻辑——城中村不是随机分布的，而是卡在地租梯度的特定位置。城市更新推进时，地价上升会把低收入群体从中心挤向外围。", "写作追问": "这节里谁住在哪里，背后的地租逻辑是什么？更新/改造会改变谁的地理位置，对他们意味着什么？", "citation": "Brueckner, J. K. (1987). The structure of urban equilibria: A unified treatment of the Muth-Mills model. In E. S. Mills (Ed.), Handbook of regional and urban economics (Vol. 2, pp. 821–845). Elsevier.", "links": [["Google Scholar · bid rent urban land Shenzhen", "https://scholar.google.com/scholar?q=bid%20rent%20urban%20land%20use%20Shenzhen%20city%20structure"], ["Semantic Scholar · Brueckner urban economics", "https://www.semanticscholar.org/search?q=Brueckner%20urban%20land%20use%20bid%20rent%20structure&sort=Relevance"], ["CNKI · 深圳 地租 城市空间 城中村", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%9C%B0%E7%A7%9F%20%E5%9F%8E%E5%B8%82%E7%A9%BA%E9%97%B4%E7%BB%93%E6%9E%84%20%E5%9F%8E%E4%B8%AD%E6%9D%91"]]}, {"id": "Krugman", "name": "Krugman · 集聚/新经济地理", "category": "城市经济学", "核心命题": "新经济地理学：规模报酬递增+运输成本+要素流动，共同决定产业集聚的地点；集聚一旦形成，就有自我强化的惯性。", "深圳意义": "解释深圳电子制造业、金融业、科技业为什么在特定区域形成集群，而不是均匀分布。也解释为什么这些集群很难迁移——即使成本上升。", "写作追问": "这节的产业为什么聚集在深圳这个位置？如果把这个集群迁走，会损失什么？", "citation": "Krugman, P. (1991). Increasing returns and economic geography. Journal of Political Economy, 99(3), 483–499. https://doi.org/10.1086/261763", "links": [["Google Scholar · agglomeration Shenzhen industry cluster", "https://scholar.google.com/scholar?q=agglomeration%20economics%20Shenzhen%20industry%20cluster%20new%20economic%20geography"], ["Semantic Scholar · Krugman economic geography", "https://www.semanticscholar.org/search?q=Krugman%20increasing%20returns%20economic%20geography%20agglomeration&sort=Relevance"], ["CNKI · 深圳 产业集聚 新经济地理", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E4%BA%A7%E4%B8%9A%E9%9B%86%E8%81%9A%20%E6%96%B0%E7%BB%8F%E6%B5%8E%E5%9C%B0%E7%90%86%20%E9%9B%86%E7%BE%A4"]]}, {"id": "Montgomery", "name": "Montgomery · 城市人口经济学", "category": "城市经济学", "核心命题": "城市人口经济学：城市规模、人口结构（年龄/技能/性别）与城市生产率和福利之间的关系；移民对城市经济的净贡献通常为正。", "深圳意义": "深圳是全球最大的移民城市实验——4000万人口中超过95%是移民。Montgomery框架帮助量化：这些移民对城市整体生产率的贡献，以及他们自身的经济命运。", "写作追问": "这节里人口的流入/流出，对城市生产率有什么影响？谁在城市里赚到了，谁是净贡献者？", "citation": "Montgomery, M. R., et al. (Eds.). (2003). Cities transformed: Demographic change and its implications in the developing world. Earthscan.", "links": [["Google Scholar · migration Shenzhen urban economics", "https://scholar.google.com/scholar?q=migration%20Shenzhen%20urban%20demographics%20productivity"], ["Semantic Scholar · urban migration developing cities", "https://www.semanticscholar.org/search?q=urban%20migration%20developing%20cities%20population%20economics&sort=Relevance"], ["CNKI · 深圳 人口流动 城市经济", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E4%BA%BA%E5%8F%A3%E6%B5%81%E5%8A%A8%20%E7%A7%BB%E6%B0%91%20%E5%9F%8E%E5%B8%82%E7%BB%8F%E6%B5%8E%E5%AD%A6"]]}, {"id": "DurantonPuga", "name": "Duranton-Puga · 集聚三机制", "category": "城市经济学", "核心命题": "集聚三机制：共享（sharing）专业化供应商和基础设施；匹配（matching）提高劳动力市场匹配质量；学习（learning）加速知识溢出。这三种机制共同解释为什么企业和工人愿意集聚。", "深圳意义": "深圳电子供应链（共享）、高科技人才市场（匹配）、创客/工程师社群（学习）——三种机制在深圳都有清晰的实例。也解释深圳为什么比别处更快完成产业升级。", "写作追问": "这节描述的集聚，主要靠哪种机制驱动？共享、匹配、学习，哪个最重要？", "citation": "Duranton, G., & Puga, D. (2004). Micro-foundations of urban agglomeration economies. In J. V. Henderson & J.-F. Thisse (Eds.), Handbook of regional and urban economics (Vol. 4, pp. 2063–2117). Elsevier.", "links": [["Google Scholar · agglomeration mechanisms Shenzhen", "https://scholar.google.com/scholar?q=agglomeration%20sharing%20matching%20learning%20Shenzhen%20cluster"], ["Semantic Scholar · Duranton Puga urban agglomeration", "https://www.semanticscholar.org/search?q=Duranton%20Puga%20micro%20foundations%20urban%20agglomeration&sort=Relevance"], ["CNKI · 深圳 集聚 供应链 人才市场", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E9%9B%86%E8%81%9A%20%E4%BE%9B%E5%BA%94%E9%93%BE%20%E4%BA%BA%E6%89%8D%E5%B8%82%E5%9C%BA%20%E7%9F%A5%E8%AF%86%E6%BA%A2%E5%87%BA"]]}, {"id": "Moretti", "name": "Moretti · 脑力枢纽与乘数效应", "category": "城市经济学", "核心命题": "脑力枢纽（Brain Hub）：高技能行业的集聚产生乘数效应——每新增1个高技能岗位，会带来约5个本地服务业岗位；知识工人的集聚程度决定城市长期命运。", "深圳意义": "解释深圳为什么要争夺高科技企业总部——不只是税收，而是乘数效应。一个华为，带来的是整个供应链和服务业的就业乘数。", "写作追问": "这节提到的高技能产业在深圳的聚集，对本地就业结构有什么乘数效应？带来了哪些二次就业？", "citation": "Moretti, E. (2012). The new geography of jobs. Houghton Mifflin Harcourt.", "links": [["Google Scholar · brain hub multiplier Shenzhen", "https://scholar.google.com/scholar?q=brain%20hub%20multiplier%20effect%20innovation%20jobs%20Shenzhen"], ["Semantic Scholar · Moretti geography jobs", "https://www.semanticscholar.org/search?q=Moretti%20new%20geography%20jobs%20innovation%20multiplier&sort=Relevance"], ["CNKI · 深圳 高技能 就业乘数 创新", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E9%AB%98%E6%8A%80%E8%83%BD%E5%B0%B1%E4%B8%9A%20%E4%B9%98%E6%95%B0%E6%95%88%E5%BA%94%20%E5%88%9B%E6%96%B0%E4%BA%A7%E4%B8%9A"]]}, {"id": "Henderson", "name": "Henderson · 最优城市规模", "category": "城市经济学", "核心命题": "最优城市规模：随着城市扩大，集聚收益先增后减；当拥挤成本（通勤、住房、污染）超过集聚收益，城市进入过度扩张区间。", "深圳意义": "深圳是否已超过最优规模？居住成本、通勤时间、环境压力是否开始侵蚀集聚优势？这是深圳能否维持增长动力的关键问题。", "写作追问": "这节描述的城市扩张，有没有拥挤成本开始超过收益的迹象？深圳的'城市天花板'在哪里？", "citation": "Henderson, J. V. (1974). The sizes and types of cities. American Economic Review, 64(4), 640–656.", "links": [["Google Scholar · optimal city size Shenzhen", "https://scholar.google.com/scholar?q=optimal%20city%20size%20congestion%20costs%20Shenzhen%20megacity"], ["Semantic Scholar · Henderson city size", "https://www.semanticscholar.org/search?q=Henderson%20optimal%20city%20size%20types%20urban&sort=Relevance"], ["CNKI · 深圳 城市规模 最优 拥挤", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%9F%8E%E5%B8%82%E8%A7%84%E6%A8%A1%20%E6%9C%80%E4%BC%98%E8%A7%84%E6%A8%A1%20%E6%8B%A5%E6%8C%A4%E6%88%90%E6%9C%AC"]]}, {"id": "RossiHansberg", "name": "Rossi-Hansberg · 城市结构增长", "category": "城市经济学", "核心命题": "城市内部空间结构影响总体生产率：不同行业的空间布局通过土地利用效率和溢出效应共同决定城市增长路径。", "深圳意义": "深圳的科技园、金融区、工业区、城中村的空间布局，不是随机的——每种布局背后有生产率逻辑。空间规划决策直接影响深圳的全要素生产率。", "写作追问": "这节提到的空间安排，是提升了要素利用效率，还是制造了新的空间摩擦？", "citation": "Rossi-Hansberg, E., & Wright, M. L. J. (2007). Urban structure and growth. Review of Economic Studies, 74(2), 597–624. https://doi.org/10.1111/j.1467-937X.2007.00432.x", "links": [["Google Scholar · urban structure growth Shenzhen", "https://scholar.google.com/scholar?q=urban%20structure%20productivity%20growth%20Shenzhen%20spatial"], ["Semantic Scholar · Rossi-Hansberg urban growth", "https://www.semanticscholar.org/search?q=Rossi-Hansberg%20urban%20structure%20growth%20productivity&sort=Relevance"], ["CNKI · 深圳 城市空间结构 生产率", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%9F%8E%E5%B8%82%E7%A9%BA%E9%97%B4%E7%BB%93%E6%9E%84%20%E5%85%A8%E8%A6%81%E7%B4%A0%E7%94%9F%E4%BA%A7%E7%8E%87%20%E5%B8%83%E5%B1%80"]]}, {"id": "Aghion", "name": "Aghion-Howitt · 创造性破坏", "category": "创新与增长经济学", "核心命题": "创造性破坏：每一次创新跃迁都意味着某个旧产业/旧工种的衰落。创新者通过打倒现有生产者获取垄断租金，这是增长的引擎，也是分配冲突的来源。", "深圳意义": "深圳每次产业升级——从山寨到自主创新，从制造到科技——都有人受益，也有人被淘汰。不写破坏只写创造是不诚实的。", "写作追问": "这节描述的创新，打败了谁？哪个旧产业、哪类工人因此失业或边缘化？", "citation": "Aghion, P., & Howitt, P. (1992). A model of growth through creative destruction. Econometrica, 60(2), 323–351. https://doi.org/10.2307/2951599", "links": [["Google Scholar · creative destruction Shenzhen innovation", "https://scholar.google.com/scholar?q=creative%20destruction%20Shenzhen%20innovation%20manufacturing%20upgrade"], ["Semantic Scholar · Aghion Howitt growth", "https://www.semanticscholar.org/search?q=Aghion%20Howitt%20creative%20destruction%20growth%20model&sort=Relevance"], ["CNKI · 深圳 创造性破坏 产业升级", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%88%9B%E9%80%A0%E6%80%A7%E7%A0%B4%E5%9D%8F%20%E4%BA%A7%E4%B8%9A%E5%8D%87%E7%BA%A7%20%E6%8A%80%E6%9C%AF%E5%88%9B%E6%96%B0"]]}, {"id": "Gerschenkron", "name": "Gerschenkron · 后发优势", "category": "创新与增长经济学", "核心命题": "后发优势：落后国家可以通过引进先进国家的成熟技术，跳过某些发展阶段，实现跨越式增长；但后发优势会随追赶成功而消退。", "深圳意义": "深圳1980-2000年代的高速增长高度依赖后发优势。但后发优势是有时限的——深圳现在面临的核心挑战正是：后发红利耗尽后，靠什么继续领先？", "写作追问": "这节描述的技术引进/学习，利用了哪些后发优势？这个优势还剩多少空间？", "citation": "Gerschenkron, A. (1962). Economic backwardness in historical perspective. Harvard University Press.", "links": [["Google Scholar · late development advantage Shenzhen", "https://scholar.google.com/scholar?q=late%20development%20advantage%20technology%20catch-up%20Shenzhen%20China"], ["Semantic Scholar · Gerschenkron catch-up", "https://www.semanticscholar.org/search?q=Gerschenkron%20economic%20backwardness%20late%20development&sort=Relevance"], ["CNKI · 深圳 后发优势 技术追赶", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%90%8E%E5%8F%91%E4%BC%98%E5%8A%BF%20%E6%8A%80%E6%9C%AF%E8%BF%BD%E8%B5%B6%20%E8%BF%BD%E8%B5%B6%E5%9E%8B%E7%BB%8F%E6%B5%8E"]]}, {"id": "Amsden", "name": "Amsden · 技术追赶", "category": "创新与增长经济学", "核心命题": "技术追赶：后发工业化需要'学习型国家'——企业通过学习（而非发明）获得竞争力，国家通过产业政策帮助企业建立技术能力。", "深圳意义": "深圳华为、中兴、比亚迪的崛起路径——都经历了从学习模仿到自主研发的追赶过程。Amsden框架帮助解释深圳'学习型企业生态'的形成。", "写作追问": "这节里的企业，是靠发明获得竞争力，还是靠学习？国家在这个学习过程中扮演了什么角色？", "citation": "Amsden, A. H. (2001). The rise of 'the rest': Challenges to the West from late-industrializing economies. Oxford University Press.", "links": [["Google Scholar · technological catch-up Shenzhen Huawei", "https://scholar.google.com/scholar?q=technological%20catch-up%20Shenzhen%20Huawei%20BYD%20learning"], ["Semantic Scholar · Amsden late industrialization", "https://www.semanticscholar.org/search?q=Amsden%20late%20industrializing%20economies%20technology%20learning&sort=Relevance"], ["CNKI · 深圳 技术学习 自主创新 华为", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E6%8A%80%E6%9C%AF%E5%AD%A6%E4%B9%A0%20%E8%87%AA%E4%B8%BB%E5%88%9B%E6%96%B0%20%E5%8D%8E%E4%B8%BA%20%E8%BF%BD%E8%B5%B6"]]}, {"id": "Tirole", "name": "Tirole · 市场势力与规制", "category": "产业与信息经济学", "核心命题": "市场势力与规制：当企业具有市场势力（垄断/寡头），需要监管介入；但监管者可能被监管对象俘获，产生'监管失灵'。", "深圳意义": "深圳平台经济（腾讯、华为生态）的监管逻辑。数字平台的网络效应自然产生市场势力，如何监管而不扼杀创新，是深圳科技监管的核心张力。", "写作追问": "这节涉及的企业有没有市场势力？监管者是在保护竞争，还是已经被监管对象影响？", "citation": "Tirole, J. (1988). The theory of industrial organization. MIT Press.", "links": [["Google Scholar · platform regulation Shenzhen China", "https://scholar.google.com/scholar?q=platform%20regulation%20market%20power%20Shenzhen%20digital%20China"], ["Semantic Scholar · Tirole industrial organization", "https://www.semanticscholar.org/search?q=Tirole%20industrial%20organization%20market%20power%20regulation&sort=Relevance"], ["CNKI · 深圳 平台监管 市场势力", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%B9%B3%E5%8F%B0%E7%BB%8F%E6%B5%8E%20%E7%9B%91%E7%AE%A1%20%E5%B8%82%E5%9C%BA%E5%8A%BF%E5%8A%9B%20%E8%85%BE%E8%AE%AF"]]}, {"id": "ShapiroVarian", "name": "Shapiro-Varian · 标准竞争与锁定", "category": "产业与信息经济学", "核心命题": "标准竞争与锁定效应：网络经济中，技术标准的胜出不只靠技术优劣，更靠用户基础；一旦锁定，转换成本极高，形成赢家通吃。", "深圳意义": "华为鸿蒙vs安卓、比亚迪电池标准vs宁德时代——这些标准竞争的本质是用户锁定的争夺。深圳企业要突破的，正是已经形成的标准壁垒。", "写作追问": "这节里的技术竞争，谁在争标准？转换成本是多少？用户被谁锁定了？", "citation": "Shapiro, C., & Varian, H. R. (1999). Information rules: A strategic guide to the network economy. Harvard Business Review Press.", "links": [["Google Scholar · standard competition lock-in Shenzhen", "https://scholar.google.com/scholar?q=standard%20competition%20lock-in%20network%20effects%20Shenzhen%20Huawei"], ["Semantic Scholar · Shapiro Varian information", "https://www.semanticscholar.org/search?q=Shapiro%20Varian%20information%20rules%20network%20economy%20standards&sort=Relevance"], ["CNKI · 深圳 技术标准 锁定效应 华为", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E6%8A%80%E6%9C%AF%E6%A0%87%E5%87%86%E7%AB%9E%E4%BA%89%20%E9%94%81%E5%AE%9A%E6%95%88%E5%BA%94%20%E7%BD%91%E7%BB%9C%E6%95%88%E5%BA%94"]]}, {"id": "RajanZingales", "name": "Rajan-Zingales · 金融发展与增长", "category": "金融地理", "核心命题": "金融发展促进增长的核心机制，是降低企业获得外部融资的门槛；金融基础设施越完善，创新企业越能以合理成本接触到资本。", "深圳意义": "深交所和前海的历史价值，不是'有了交易所'，而是创新企业第一次可以以合理成本融资。这个成本结构的改变，比任何象征性的开放姿态都更有解释力。", "写作追问": "这节里的金融机制，真正降低了谁的融资门槛？哪类企业因此受益？哪类仍然被排除在外？", "citation": "Rajan, R. G., & Zingales, L. (1998). Financial dependence and growth. American Economic Review, 88(3), 559–586.", "links": [["Google Scholar · financial development Shenzhen SZSE", "https://scholar.google.com/scholar?q=financial%20development%20growth%20Shenzhen%20stock%20exchange%20innovation"], ["Semantic Scholar · Rajan Zingales finance", "https://www.semanticscholar.org/search?q=Rajan%20Zingales%20financial%20dependence%20growth&sort=Relevance"], ["CNKI · 深圳 金融发展 融资 创新", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E9%87%91%E8%9E%8D%E5%8F%91%E5%B1%95%20%E8%9E%8D%E8%B5%84%E9%97%A8%E6%A7%9B%20%E5%88%9B%E6%96%B0%E4%BC%81%E4%B8%9A%20%E6%B7%B1%E4%BA%A4%E6%89%80"]]}, {"id": "Wojcik", "name": "Wójcik · 金融地理", "category": "金融地理", "核心命题": "金融地理：金融服务业的空间集聚不只产生效率，也产生信息不对称和系统性风险；金融中心的形成有深刻的政治经济学根源。", "深圳意义": "深圳金融中心的崛起不是自然发生的，是政策选择和地缘政治共同作用的结果。前海的金融地位涉及深港两套体系的制度摩擦与互补。", "写作追问": "深圳金融业的空间聚集，除了效率，还产生了什么风险或权力集中？", "citation": "Wójcik, D. (2011). The global stock market: Issuers, investors, and intermediaries in an uneven world. Oxford University Press.", "links": [["Google Scholar · financial geography Shenzhen Qianhai", "https://scholar.google.com/scholar?q=financial%20geography%20Shenzhen%20Qianhai%20Hong%20Kong%20financial%20center"], ["Semantic Scholar · Wójcik financial geography", "https://www.semanticscholar.org/search?q=Wojcik%20global%20financial%20geography%20stock%20market&sort=Relevance"], ["CNKI · 深圳 金融地理 前海 深港", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E9%87%91%E8%9E%8D%E5%9C%B0%E7%90%86%20%E5%89%8D%E6%B5%B7%20%E9%87%91%E8%9E%8D%E4%B8%AD%E5%BF%83%20%E6%B7%B1%E6%B8%AF"]]}, {"id": "SternWeitzman", "name": "Stern-Weitzman · 气候经济学", "category": "绿色经济学", "核心命题": "气候变化的经济学：气候风险具有'肥尾'特征（极端情景概率被低估）；应对气候变化的社会收益远超成本，需要大规模公共干预。", "深圳意义": "深圳的绿色转型——电动车产业（比亚迪）、绿色建筑、碳市场先行先试——是把气候经济学原理转化为政策的城市实验。", "写作追问": "这节描述的绿色政策，有没有内化气候的外部性？谁在承担转型成本，谁在获取绿色红利？", "citation": "Stern, N. (2007). The economics of climate change: The Stern review. Cambridge University Press.", "links": [["Google Scholar · green economy Shenzhen climate", "https://scholar.google.com/scholar?q=green%20economy%20transition%20Shenzhen%20BYD%20electric%20vehicles%20carbon"], ["Semantic Scholar · climate economics Stern", "https://www.semanticscholar.org/search?q=Stern%20climate%20change%20economics%20review%20policy&sort=Relevance"], ["CNKI · 深圳 绿色经济 气候政策 比亚迪", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E7%BB%BF%E8%89%B2%E7%BB%8F%E6%B5%8E%20%E6%B0%94%E5%80%99%E6%94%BF%E7%AD%96%20%E6%96%B0%E8%83%BD%E6%BA%90"]]}, {"id": "Porter", "name": "Porter假说 · 环境规制→创新", "category": "绿色经济学", "核心命题": "波特假说：严格的环境规制不必然损害竞争力；设计良好的规制反而能倒逼创新，形成'先动优势'——污染许可证贵了，才会发明更清洁的技术。", "深圳意义": "深圳的排放标准和产品规制，是否真的倒逼了绿色技术创新？比亚迪的电动车优势，有多少来自深圳严格的排放政策？", "写作追问": "这节的环境规制，是在倒逼创新，还是只是增加了合规成本？有没有波特假说成立的具体案例？", "citation": "Porter, M. E., & van der Linde, C. (1995). Toward a new conception of the environment-competitiveness relationship. Journal of Economic Perspectives, 9(4), 97–118. https://doi.org/10.1257/jep.9.4.97", "links": [["Google Scholar · Porter hypothesis Shenzhen regulation innovation", "https://scholar.google.com/scholar?q=Porter%20hypothesis%20environmental%20regulation%20innovation%20Shenzhen"], ["Semantic Scholar · Porter environment competitiveness", "https://www.semanticscholar.org/search?q=Porter%20van%20der%20Linde%20environment%20competitiveness%20regulation&sort=Relevance"], ["CNKI · 深圳 环境规制 绿色创新 波特假说", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E7%8E%AF%E5%A2%83%E8%A7%84%E5%88%B6%20%E7%BB%BF%E8%89%B2%E5%88%9B%E6%96%B0%20%E6%B3%A2%E7%89%B9%E5%81%87%E8%AF%B4"]]}, {"id": "LuMing", "name": "陆铭 · 大国大城/户籍", "category": "中国政治经济学", "核心命题": "大国大城：集聚是生产率提升的根本来源；户籍制度限制了人口向大城市流动，造成效率损失；应该让劳动力自由流向最能发挥其价值的城市。", "深圳意义": "深圳是陆铭理论的最强证据之一——当户籍门槛相对较低时，大规模人口集聚确实带来了生产率提升。但深圳也是理论的悖论：即使'来了就是深圳人'，多数建设者仍不能真正定居。", "写作追问": "这节里的劳动力流动，有没有被制度障碍扭曲？谁因为户籍无法真正留下来？", "citation": "陆铭. (2016). 大国大城：当代中国的统一、发展与平衡. 上海人民出版社.", "links": [["Google Scholar · hukou Shenzhen labor mobility", "https://scholar.google.com/scholar?q=hukou%20Shenzhen%20labor%20mobility%20urban%20rural%20migration"], ["Semantic Scholar · China hukou system", "https://www.semanticscholar.org/search?q=China%20hukou%20household%20registration%20system%20urban%20rural&sort=Relevance"], ["CNKI · 深圳 户籍 劳动力流动 城镇化", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E6%88%B7%E7%B1%8D%E5%88%B6%E5%BA%A6%20%E5%8A%B3%E5%8A%A8%E5%8A%9B%E6%B5%81%E5%8A%A8%20%E5%9F%8E%E9%95%87%E5%8C%96"]]}, {"id": "CaiFang", "name": "蔡昉 · 刘易斯转折点", "category": "中国政治经济学", "核心命题": "刘易斯转折点：农村剩余劳动力向城市无限供给的时代已经结束；中国劳动力成本上升，传统劳动密集型增长模式不可持续，必须依赖全要素生产率提升。", "深圳意义": "深圳1980年代靠廉价劳动力起家的时代已经过去。现在的深圳必须用知识密集型增长替代劳动密集型增长。'人口红利'的消失是深圳产业升级的最深层压力。", "写作追问": "这节的增长模式，依赖的是廉价劳动力还是生产率提升？深圳是否已经跨越了这个转折点？", "citation": "蔡昉. (2010). 人口转变、人口红利与刘易斯转折点. 经济研究, (4), 4–13.", "links": [["Google Scholar · Lewis turning point Shenzhen labor", "https://scholar.google.com/scholar?q=Lewis%20turning%20point%20China%20Shenzhen%20labor%20cost%20wage"], ["Semantic Scholar · China labor surplus", "https://www.semanticscholar.org/search?q=China%20labor%20surplus%20Lewis%20turning%20point%20demographic%20dividend&sort=Relevance"], ["CNKI · 深圳 刘易斯转折点 劳动力成本 人口红利", "https://kns.cnki.net/kns8/defaultresult/index?dbcode=SCDB&kw=%E6%B7%B1%E5%9C%B3%20%E5%88%98%E6%98%93%E6%96%AF%E8%BD%AC%E6%8A%98%E7%82%B9%20%E5%8A%B3%E5%8A%A8%E5%8A%9B%E6%88%90%E6%9C%AC%20%E4%BA%BA%E5%8F%A3%E7%BA%A2%E5%88%A9"]]}, {"id": "KamWingChan", "name": "Kam Wing Chan · 无形的墙", "category": "社会流动与人口", "核心命题": "中国的户籍制度是一堵'无形的墙'，进城的农民工可以工作，但无法获得完整市民权利（教育、医疗、社保），形成二元城市社会。", "深圳意义": "深圳'来了就是深圳人'的豪言背后，是Chan揭示的现实——绝大多数建设者至今不是完整意义上的深圳人。这是深圳制度涌现中代价最集中的地方。", "写作追问": "这节里的劳动者，享受到了城市的哪些权利？被'墙'挡在外面的又是哪些？", "citation": "Chan, K. W., & Buckingham, W. (2008). Is China abolishing the hukou system? The China Quarterly, 195, 582–606. https://doi.org/10.1017/S0305741008000787", "links": [["Google Scholar · hukou invisible wall Shenzhen migrant", "https://scholar.google.com/scholar?q=hukou%20invisible%20wall%20Shenzhen%20migrant%20workers%20rights"], ["Semantic Scholar · Chan hukou China", "https://www.semanticscholar.org/search?q=Chan%20hukou%20system%20China%20migrant%20workers%20urbanization&sort=Relevance"], ["CNKI · 深圳 户籍 农民工 市民化",     ? `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;margin-top:4px">
        <span style="width:14px;height:14px;border-radius:50%;background:${ch.author_color};display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff">${ch.author_initials}</span>
        <span style="color:var(--muted)">${ch.author} · ${ch.author_date}</span>
      </span>` : '';
  const statusTag = ch.status === 'written'
    ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;margin-top:4px;padding:2px 7px;border-radius:10px;background:#bbf7d0;color:#166534;font-weight:600">✓ 已写 · ${(ch.cn_chars||0).toLocaleString()}字 · ${ch.evidence_verified?'证据已核查':''}</span>`
    : `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;margin-top:4px;padding:2px 7px;border-radius:10px;background:#f1f5f9;color:#94a3b8;font-weight:500">○ 大纲待写</span>`;
  document.getElementById('cp-part').innerHTML = `${part.char}篇 · ${part.name}${authorTag}<br>${statusTag}`;

  // Categorise theories for this chapter
  const core=[], aux=[], missingCore=[], missingAux=[];
  D.theories.forEach(t=>{
    const s = eff(t.id, chnum);
    const bp = bpStatus(t.id, ch.part);
    const used = s.includes('core')||s.includes('aux');
    if(s.includes('core')) core.push(t);
    else if(s.includes('aux')) aux.push(t);
    else if(bp==='core') missingCore.push(t);
    else if(bp==='aux')  missingAux.push(t);
  });
  const total = core.length+aux.length+missingCore.length+missingAux.length;
  const done  = core.length+aux.length;
  const pct   = total ? Math.round(done/total*100) : 100;
  const fillColor = pct>=80?'#22c55e':pct>=50?'#f59e0b':'#ef4444';

  document.getElementById('cp-bar-fill').style.width = pct+'%';
  document.getElementById('cp-bar-fill').style.background = fillColor;
  document.getElementById('cp-pct').textContent =
    `${done}/${total} 理论完成 · ${pct}% · 核心 ${core.length} · 辅助 ${aux.length}`;

  // Body
  let html='';

  if(missingCore.length){
    html+=`<div class="cp-section"><div class="cp-slabel core">🔴 核心缺口（${missingCore.length}）</div>`;
    missingCore.forEach(t=>{
      const hint = D.hints?.[String(chnum)]?.[t.id]||t['深圳意义']||'';
      const q    = t['写作追问']||'';
      html+=`<div class="cp-item">
        <div class="cn">${t.name}</div>
        ${hint?`<div class="ch">${hint}</div>`:''}
        ${q?`<div class="cq">💡 ${q}</div>`:''}
        <div class="clinks">
          ${(t.links||[]).slice(0,2).map(([l,u])=>`<a class="lnk" href="${u}" target="_blank">${l.split('·')[0].trim()}</a>`).join('')}
          <span class="lnk" onclick="showEnc('${t.id}');closeChPanel();switchTab('enc')">📚 详情</span>
        </div>
      </div>`;
    });
    html+='</div>';
  }

  if(missingAux.length){
    html+=`<div class="cp-section"><div class="cp-slabel aux">🟡 辅助缺口（${missingAux.length}）</div>`;
    missingAux.forEach(t=>{
      const hint = D.hints?.[String(chnum)]?.[t.id]||t['深圳意义']||'';
      html+=`<div class="cp-item">
        <div class="cn">${t.name}</div>
        ${hint?`<div class="ch">${hint.substring(0,80)}…</div>`:''}
        <div class="clinks">
          ${(t.links||[]).slice(0,1).map(([l,u])=>`<a class="lnk" href="${u}" target="_blank">${l.split('·')[0].trim()}</a>`).join('')}
          <span class="lnk" onclick="showEnc('${t.id}');closeChPanel();switchTab('enc')">📚 详情</span>
        </div>
      </div>`;
    });
    html+='</div>';
  }

  if(core.length||aux.length){
    html+=`<div class="cp-section"><div class="cp-slabel done">✅ 已引用</div>
      <div class="cp-done-chips">
        ${core.map(t=>`<span class="cp-chip core">●&nbsp;${t.name}</span>`).join('')}
        ${aux.map(t=>`<span class="cp-chip aux">○&nbsp;${t.name}</span>`).join('')}
      </div></div>`;
  }

  if(!html) html=`<p style="color:var(--muted);font-size:12px;padding:8px 0">此章暂无大纲建议理论</p>`;
  document.getElementById('cp-body').innerHTML = html;

  // Highlight column
  highlightCol(chnum, true);

  document.getElementById('ch-panel').classList.add('open');
  document.getElementById('cp-overlay').classList.add('show');
}

function closeChPanel(){
  if(activeCh) highlightCol(activeCh, false);
  activeCh=null;
  document.getElementById('ch-panel').classList.remove('open');
  document.getElementById('cp-overlay').classList.remove('show');
}

function highlightCol(chnum, on){
  document.querySelectorAll(`.cell[data-ch="${chnum}"]`).forEach(el=>{

}

// ── Effective status ─────────────────────────────────
function eff(tid, chnum){
  const k=`${tid}__${chnum}`;
  return manOv[k] ? 'manual_'+manOv[k] : (D.matrix[tid]?.[String(chnum)]||'none');
}
function bpStatus(tid, partId){
  const a=D.blueprint[tid]; return a ? a[partId] : 'none';
}

// ══════════════════════════════════════════════════════
// MATRIX VIEW
// ══════════════════════════════════════════════════════
function buildMatrix(){
  const lcol = document.getElementById('lcol');
  const rp   = document.getElementById('rpanel');
  // left col
  let lh = '<div class="spc"></div>';
  D.theories.forEach((t,i)=>{
    const prev = i>0?D.theories[i-1]:null;
    if(!prev||prev.category!==t.category) lh+=`<div class="cat-h">${t.category}</div>`;
    lh+=`<div class="tlabel" onclick="showEnc('${t.id}')" title="${t.name}">${t.name}</div>`;
  });
  lcol.innerHTML=lh;
  // header
  let hh='<div class="chdr"><div class="part-row">';
  D.parts.forEach(p=>{
    const cnt=D.chapters.filter(c=>c.part===p.id).length;
    hh+=`<div class="pcell" style="width:${cnt*28}px;background:${p.color}22;border-top:3px solid ${p.color}">
      <span style="color:${p.color}">${p.char}</span>&nbsp;<span style="font-size:9px;color:#9ca3af">${p.name}</span></div>`;
  });
  hh+='</div><div class="ch-row">';
  D.chapters.forEach((ch,i)=>{
    const pl=i<D.chapters.length-1&&D.chapters[i+1].part!==ch.part;
    const av=ch.author_color||'#4b5563';
    const ini=ch.author_initials||'?';
    hh+=`<div class="chcell${pl?' pl':''}" title="${ch.title}&#10;最后编辑：${ch.author||'未知'} · ${ch.author_date||''}" onclick="openChPanel(${ch.num})">
      <div class="ch-avatar" style="background:${av}">${ini}</div>
      <div class="ch-label">第${ch.num}章</div>
    </div>`;
  });
  hh+='</div></div>';
  // rows
  let rows='<div>';
  D.theories.forEach((t,ti)=>{
    const prev=ti>0?D.theories[ti-1]:null;
    rows+=`<div style="display:flex${!prev||prev.category!==t.category?';border-top:1px solid #2e3148':''}">`;
    D.chapters.forEach((ch,ci)=>{
      const s=eff(t.id,ch.num);
      const isMan=!!manOv[`${t.id}__${ch.num}`];
      const bp=bpStatus(t.id,ch.part);
      const empty=s==='none'||s==='manual_none';
      const bpc=showBp&&empty&&bp==='core'?' bpc':'';
      const bpa=showBp&&empty&&bp==='aux'?' bpa':'';
      const pl=ci<D.chapters.length-1&&D.chapters[ci+1].part!==ch.part;
      const icon=s.includes('core')?'●':s.includes('aux')?'○':'·';
      rows+=`<div class="cell${bpc}${bpa}${pl?' pl':''}${isMan?' mo':''}" data-s="${s}" data-tid="${t.id}" data-ch="${ch.num}"
        onclick="cycleCell(this)" ondblclick="resetCell(this)"
        onmouseenter="showTT(event,this)" onmouseleave="hideTT()">
        <span class="ci">${icon}</span></div>`;
    });
    rows+='</div>';
  });
  rows+='</div>';
  rp.innerHTML=hh+rows;
  rp.addEventListener('scroll',()=>{ lcol.style.marginTop='-'+rp.scrollTop+'px'; });
}

function cycleCell(el){
  const tid=el.dataset.tid, ch=el.dataset.ch;
  const k=`${tid}__${ch}`;
  const cur=(manOv[k]||eff(tid,ch)).replace('manual_','');
  const states=['none','core','aux'];
  manOv[k]=states[(states.indexOf(cur)+1)%3];
  localStorage.setItem('sz_ov',JSON.stringify(manOv));
  refreshCell(el); updateStats(); rebuildRemind();
}
function resetCell(el){
  const k=`${el.dataset.tid}__${el.dataset.ch}`;
  delete manOv[k];
  localStorage.setItem('sz_ov',JSON.stringify(manOv));
  refreshCell(el); updateStats(); rebuildRemind();
}
function refreshCell(el){
  const tid=el.dataset.tid, ch=parseInt(el.dataset.ch);
  const s=eff(tid,ch);
  el.dataset.s=s;
  el.classList.toggle('mo',!!manOv[`${tid}__${ch}`]);
  el.querySelector('.ci').textContent=s.includes('core')?'●':s.includes('aux')?'○':'·';
  // blueprint outlines
  const chObj=D.chapters.find(c=>c.num===ch);
  const bp=bpStatus(tid,chObj.part);
  const empty=s==='none'||s==='manual_none';
  el.classList.toggle('bpc',showBp&&empty&&bp==='core');
  el.classList.toggle('bpa',showBp&&empty&&bp==='aux');
}

function toggleBp(){ showBp=!showBp; buildMatrix(); }

// ── Stats ─────────────────────────────────────────────
function updateStats(){
  let total=0,core=0,aux=0;
  D.theories.forEach(t=>D.chapters.forEach(ch=>{
    const s=eff(t.id,ch.num); total++;
    if(s.includes('core'))core++; else if(s.includes('aux'))aux++;
  }));
  document.getElementById('st1').innerHTML=`理论 <b>${D.theories.length}</b>`;
  document.getElementById('st2').innerHTML=`核心 <b>${core}</b> · 辅助 <b>${aux}</b>`;
  document.getElementById('st3').innerHTML=`覆盖 <b>${((core+aux)/total*100).toFixed(1)}%</b>`;
}

// ── Tooltip ───────────────────────────────────────────
function showTT(e,el){
  const tid=el.dataset.tid, chnum=parseInt(el.dataset.ch);
  const t=D.theories.find(x=>x.id===tid);
  const ch=D.chapters.find(x=>x.num===chnum);
  const s=eff(tid,chnum);
  const snip=D.snippets[tid]?.[String(chnum)]||'';
  const bp=bpStatus(tid,ch.part);
  const sl=s.includes('core')?'✅ 锚点检测':s.includes('aux')?'🟡 文本检测':'— 未检测';
  const bpl=bp==='core'?'📋 大纲：核心':bp==='aux'?'📋 大纲：辅助':'';
  const isMan=!!manOv[`${tid}__${chnum}`];
  document.getElementById('tt').innerHTML=
    `<b>${t.name}</b><br><span class="s">第${ch.num}章 · ${ch.title}</span><br>
    ${sl}${isMan?' <span style="color:#818cf8">[手动]</span>':''}<br>
    ${snip?`<span class="s">${snip}</span><br>`:''}
    ${bpl?`<span style="color:#6b7280">${bpl}</span><br>`:''}
    ${t['写作追问']?`<span style="color:#60a5fa;font-size:10px">${t['写作追问']}</span>`:''}`;
  moveTT(e);
  document.getElementById('tt').style.display='block';
}
function moveTT(e){
  const tt=document.getElementById('tt');
  tt.style.left=Math.min(e.clientX+14,window.innerWidth-280)+'px';
  tt.style.top=Math.min(e.clientY+14,window.innerHeight-180)+'px';
}
document.addEventListener('mousemove',e=>{const tt=document.getElementById('tt');if(tt.style.display==='block')moveTT(e);});
function hideTT(){ document.getElementById('tt').style.display='none'; }

// ══════════════════════════════════════════════════════
// REMINDER VIEW
// ══════════════════════════════════════════════════════
function buildRemind(){ rebuildRemind(); }
function rebuildRemind(){
  const cont=document.getElementById('remind-content');
  let html='';
  D.chapters.forEach(ch=>{
    const bpArr=D.blueprint;
    // find gaps
    const missingCore=[], missingAux=[], done=[];
    D.theories.forEach(t=>{
      const s=eff(t.id,ch.num);
      const bp=bpStatus(t.id,ch.part);
      const used=s.includes('core')||s.includes('aux');
      if(used){ done.push(t); }
      else if(bp==='core'){ missingCore.push(t); }
      else if(bp==='aux'){ missingAux.push(t); }
    });
    const total=missingCore.length+missingAux.length+done.length;
    const pct=total?Math.round(done.length/total*100):100;
    const scoreClass=pct>=80?'done':pct>=50?'warn':'danger';
    const fillColor=pct>=80?'#22c55e':pct>=50?'#f59e0b':'#ef4444';
    const part=D.parts.find(p=>p.id===ch.part);

    html+=`<div class="rchapter">
      <div class="rch-head" onclick="toggleCh(this)">
        <span class="rch-num" style="color:${part.color}">${ch.num}</span>
        <div style="flex:1">
          <div class="rch-title">第${ch.num}章 · ${ch.title}</div>
          <div style="font-size:10px;color:var(--muted)">${part.char}篇 · ${part.name}</div>
        </div>
        <span class="rch-score ${scoreClass}">${done.length}/${total} 完成 ${pct}%</span>
        <span style="color:var(--muted);font-size:12px;margin-left:8px">▼</span>
      </div>
      <div class="rch-bar"><div class="rch-fill" style="width:${pct}%;background:${fillColor}"></div></div>
      <div class="rch-body">`;

    // missing core
    if(missingCore.length){
      html+=`<div class="gap-section"><div class="gap-label core">🔴 核心理论 — 大纲建议引用，尚未写入（${missingCore.length}个）</div>`;
      missingCore.forEach(t=>{
        const hint=D.hints?.[String(ch.num)]?.[t.id]||t['深圳意义']||'';
        const q=t['写作追问']||'';
        html+=`<div class="gap-item">
          <div class="gap-dot core"></div>
          <div class="gap-info">
            <div class="gap-name">${t.name}</div>
            ${hint?`<div class="gap-hint">${hint}</div>`:''}
            ${q?`<div class="gap-q">💡 ${q}</div>`:''}
            <div class="gap-links">
              ${(t.links||[]).map(([label,url])=>`<a class="lnk" href="${url}" target="_blank">${label}</a>`).join('')}
              <span class="lnk" onclick="showEnc('${t.id}');switchTab('enc')">📚 理论详情</span>
            </div>
          </div></div>`;
      });
      html+='</div>';
    }

    // missing aux
    if(missingAux.length){
      html+=`<div class="gap-section"><div class="gap-label aux">🟡 辅助理论 — 建议参考（${missingAux.length}个）</div>`;
      missingAux.forEach(t=>{
        const hint=D.hints?.[String(ch.num)]?.[t.id]||t['深圳意义']||'';
        const q=t['写作追问']||'';
        html+=`<div class="gap-item">
          <div class="gap-dot aux"></div>
          <div class="gap-info">
            <div class="gap-name">${t.name}</div>
            ${hint?`<div class="gap-hint">${hint}</div>`:''}
            ${q?`<div class="gap-q">💡 ${q}</div>`:''}
            <div class="gap-links">
              ${(t.links||[]).map(([label,url])=>`<a class="lnk" href="${url}" target="_blank">${label}</a>`).join('')}
              <span class="lnk" onclick="showEnc('${t.id}');switchTab('enc')">📚 理论详情</span>
            </div>
          </div></div>`;
      });
      html+='</div>';
    }

    // done
    if(done.length){
      html+=`<div class="gap-section">
        <div class="gap-label" style="color:#22c55e">✅ 已引用（${done.length}个）</div>
        <div class="done-list">${done.map(t=>`<span class="done-chip">${t.name}</span>`).join('')}</div>
      </div>`;
    }
    if(!missingCore.length&&!missingAux.length&&!done.length){
      html+=`<p style="color:var(--muted);font-size:12px;padding:8px 0">此章暂无大纲建议理论（贯穿全书的核心框架除外）</p>`;
    }
    html+='</div></div>';
  });
  cont.innerHTML=html;
}

function toggleCh(head){
  const body=head.nextElementSibling.nextElementSibling;
  body.classList.toggle('open');
  head.querySelector('span:last-child').textContent=body.classList.contains('open')?'▲':'▼';
}

// ══════════════════════════════════════════════════════
// ENCYCLOPEDIA VIEW
// ══════════════════════════════════════════════════════
function buildEnc(){
  const list=document.getElementById('enc-list');
  let html='';
  D.theories.forEach((t,i)=>{
    const prev=i>0?D.theories[i-1]:null;
    if(!prev||prev.category!==t.category) html+=`<div class="enc-cat">${t.category}</div>`;
    html+=`<div class="enc-item" id="encitem-${t.id}" onclick="showEnc('${t.id}')">${t.name}</div>`;
  });
  list.innerHTML=html;
}

function showEnc(tid){
  switchTab('enc');
  document.querySelectorAll('.enc-item').forEach(el=>el.classList.remove('active'));
  const item=document.getElementById('encitem-'+tid);
  if(item){ item.classList.add('active'); item.scrollIntoView({block:'nearest'}); }
  const t=D.theories.find(x=>x.id===tid);
  if(!t) return;
  // usage across chapters
  const usageChips=D.chapters.map(ch=>{
    const s=eff(tid,ch.num);
    const cls=s.includes('core')?'core':s.includes('aux')?'aux':'none';
    return `<span class="uchip ${cls}" title="${ch.title}" onclick="switchTab('matrix')">${ch.num}</span>`;
  }).join('');
  const links=(t.links||[]).map(([label,url])=>
    `<a class="enc-link" href="${url}" target="_blank"><span>${label}</span><span class="arr">↗</span></a>`
  ).join('');
  document.getElementById('enc-detail').innerHTML=`
    <h2>${t.name}</h2>
    <div class="cat-tag">${t.category}</div>
    ${t['核心命题']?`<div class="enc-section"><h3>核心命题</h3><p>${t['核心命题']}</p></div>`:''}
    ${t['深圳意义']?`<div class="enc-section"><h3>深圳意义</h3><p>${t['深圳意义']}</p></div>`:''}
    ${t['写作追问']?`<div class="enc-section"><h3>写作时追问</h3><div class="enc-q">${t['写作追问']}</div></div>`:''}
    <div class="enc-section"><h3>各章使用情况</h3>
      <div style="font-size:10px;color:var(--muted);margin-bottom:5px">绿=锚点检测 · 黄=文本检测 · 灰=未用 · 点击跳转矩阵</div>
      <div class="enc-usage">${usageChips}</div></div>
    ${t.citation?`<div class="enc-section"><h3>APA引用</h3><div class="enc-cite">${t.citation}</div></div>`:''}
    ${links?`<div class="enc-section"><h3>文献搜索</h3><div class="enc-links">${links}</div></div>`:''}
  `;
}

// ── Export ────────────────────────────────────────────
function exportOv(){
  const blob=new Blob([JSON.stringify(manOv,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='theory_overrides.json'; a.click();
  alert('已下载 theory_overrides.json\n保存到仓库根目录后，下次 git commit 时会自动合并。');
}
